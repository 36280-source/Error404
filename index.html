<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Space Register</title>

<style>
body{
    margin:0;
    height:100vh;
    overflow:hidden;
    font-family:Arial;
    background:black;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
}

/* 🌌 พื้นหลังดาว */
.stars, .stars2, .stars3{
    position:absolute;
    width:200%;
    height:200%;
    background-repeat:repeat;
    background-image:
    radial-gradient(2px 2px at 20px 30px, white, transparent),
    radial-gradient(2px 2px at 40px 70px, white, transparent),
    radial-gradient(1px 1px at 90px 40px, white, transparent),
    radial-gradient(1px 1px at 130px 80px, white, transparent);
    animation: moveStars 60s linear infinite;
    opacity:0.5;
}

.stars2{ animation-duration:120s; opacity:0.3; }
.stars3{ animation-duration:180s; opacity:0.2; }

@keyframes moveStars{
    from{transform:translateY(0px);}
    to{transform:translateY(-1000px);}
}

/* กล่อง */
.box{
    position:relative;
    z-index:2;
    width:350px;
    padding:25px;
    border-radius:15px;
    background:rgba(255,255,255,0.08);
    backdrop-filter: blur(10px);
    box-shadow:0 0 30px rgba(0,255,255,0.2);
}

/* input */
input{
    width:100%;
    padding:10px;
    margin:6px 0;
    border:none;
    border-radius:8px;
    outline:none;
}

/* ปุ่ม */
button{
    width:100%;
    padding:10px;
    margin-top:10px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    background:#00c6ff;
    color:black;
    font-weight:bold;
}

button:hover{
    background:#00ffcc;
}

/* เอฟเฟกต์อีเมลหมุน */
#email{
    display:block;
    transition:0.3s;
}

#username{
    position:relative;
    transition:0.1s;
}

/* glow text */
h2{
    text-align:center;
    text-shadow:0 0 10px cyan;
}

#status{
    text-align:center;
    margin-top:10px;
    color:#00ffcc;
}
</style>
</head>

<body>

<!-- 🌌 ดาว -->
<div class="stars"></div>
<div class="stars2"></div>
<div class="stars3"></div>

<div class="box">
    <h2>🚀 SPACE REGISTER</h2>

    <input id="username" placeholder="ชื่อผู้ใช้ (จับให้ได้!)">
    <input id="email" placeholder="อีเมล (กำลังหมุนในจักรวาล)">

    <input id="day" placeholder="วัน">
    <input id="month" placeholder="เดือน">
    <input id="year" placeholder="ปี">

    <button onclick="stopAll()">หยุดจักรวาลวันเกิด</button>
    <button onclick="register()">สมัครเข้าสู่อวกาศ</button>

    <div id="status"></div>
</div>

<script>

// 🌠 ชื่อหนีเมาส์
let username = document.getElementById("username");
document.addEventListener("mousemove",(e)=>{
    let x = (Math.random()*200)-100;
    let y = (Math.random()*80)-40;
    username.style.transform = `translate(${x}px,${y}px)`;
});

// 🌌 อีเมลหมุน
let email = document.getElementById("email");
setInterval(()=>{
    email.style.transform = `rotate(${Math.random()*360}deg)`;
},500);

// 🎲 สุ่มวันเกิด
let d = setInterval(()=>{
    document.getElementById("day").value = Math.floor(Math.random()*31)+1;
},250);

let m = setInterval(()=>{
    document.getElementById("month").value = Math.floor(Math.random()*12)+1;
},500);

let y = setInterval(()=>{
    document.getElementById("year").value = Math.floor(Math.random()*60)+1960;
},900);

function stopAll(){
    clearInterval(d);
    clearInterval(m);
    clearInterval(y);

    document.getElementById("status").innerText =
    "🪐 คุณหยุดเวลาในจักรวาลได้แล้ว!";
}

// 🚀 สมัคร
function register(){
    let q = prompt("ยืนยันตัวตนจักรวาล: คุณเป็นสิ่งมีชีวิตหรือไม่?");

    if(q){
        document.getElementById("status").innerText =
        "✨ ยินดีต้อนรับสู่จักรวาล!";
    }else{
        document.getElementById("status").innerText =
        "💥 ระบบงง แต่ให้ผ่านอยู่ดี";
    }
}

</script>

</body>
</html>
