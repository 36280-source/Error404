<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>กลุ่มเบียว Pizza</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
animation:party 0.4s infinite;
}

@keyframes party{
0%{background:#ff0000;}
20%{background:#ff00ff;}
40%{background:#0000ff;}
60%{background:#00ff00;}
80%{background:#ffff00;}
100%{background:#00ffff;}
}

.card{
background:rgba(0,0,0,.75);
padding:30px;
border-radius:20px;
width:420px;
text-align:center;
color:white;
box-shadow:0 0 40px white;
}

h1{
margin-bottom:20px;
animation:flash .4s infinite;
}

@keyframes flash{
50%{
color:red;
text-shadow:0 0 20px white;
}
}

input,select{
width:90%;
padding:12px;
margin:10px;
border:none;
border-radius:10px;
font-size:18px;
}

#name{
animation:move1 2s infinite alternate;
}

#age{
animation:move2 1.5s infinite;
}

#alias{
animation:move3 3s infinite;
}

@keyframes move1{
from{transform:translateX(-10px);}
to{transform:translateX(10px);}
}

@keyframes move2{
0%{transform:translateY(-5px);}
50%{transform:translateY(8px);}
100%{transform:translateY(-5px);}
}

@keyframes move3{
0%{transform:rotate(-2deg);}
50%{transform:rotate(2deg) scale(1.05);}
100%{transform:rotate(-2deg);}
}

button{
margin-top:20px;
padding:15px 30px;
font-size:20px;
background:red;
color:white;
border:none;
border-radius:15px;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:scale(1.1);
background:orange;
}

#result{
margin-top:20px;
font-size:22px;
font-weight:bold;
color:yellow;
}
</style>

</head>
<body>

<div class="card">

<h1>😎 ยินดีต้อนรับกลุ่มเบียว 😎</h1>

<input id="name" placeholder="ชื่อ">

<input id="age" type="number" placeholder="อายุ">

<input id="alias" placeholder="ฉายา">

<select id="pizza">
<option>🍕 พิซซ่ารสลาบ</option>
<option>🌶️ พิซซ่ารสส้มตำ</option>
</select>

<button onclick="orderPizza()">สั่งพิซซ่า</button>

<div id="result"></div>

</div>

<script>

function orderPizza(){

let name=document.getElementById("name").value;
let age=document.getElementById("age").value;
let alias=document.getElementById("alias").value;
let pizza=document.getElementById("pizza").value;

if(name==""||age==""||alias==""){
alert("กรอกข้อมูลให้ครบก่อน!");
return;
}

document.getElementById("result").innerHTML=
`
🍕 สั่งสำเร็จ!<br><br>
ชื่อ : ${name}<br>
อายุ : ${age}<br>
ฉายา : ${alias}<br>
เมนู : ${pizza}<br><br>
กำลังอบพิซซ่า...🔥
`;

}

</script>

</body>
</html>
